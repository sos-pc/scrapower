[project]
name = "scrapower"
version = "0.1.0"
description = "Distributed computing aggregator for heterogeneous free resources"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "aiosqlite>=0.20",
    "structlog>=24.0",
    "aiohttp>=3.10",
    # httpx is a runtime dep: cli/main.py imports it at module level, so the
    # `scrapower` entry point breaks on a plain install without it.
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "ruff>=0.8",
]
drive = [
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.0",
]
# Worker providers the coordinator drives: modal/huggingface_hub are imported,
# kaggle and yt-dlp are invoked as CLIs. Previously installed only via a
# parallel unpinned list in the Dockerfile.
providers = [
    "kaggle>=1.6",
    "modal>=1.0",
    "huggingface_hub>=0.24",
    "yt-dlp>=2025.1.1",
]

[project.scripts]
scrapower = "scrapower.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# UP042: TaskState is intentionally `(str, Enum)` — its values are persisted
# to SQLite, so it must be a real str subclass.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# main.py registers routers/middleware after `app = FastAPI(...)`, so those
# imports are intentionally not at the top of the file.
"src/scrapower/coordinator/main.py" = ["E402"]
